<!DOCTYPE html>
<html data-page="index" lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paddi Studio · 万建伟 JewwyWan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css?v=20260720a">
  <link rel="stylesheet" href="./css/variables.css?v=20260720a">
  <link rel="stylesheet" href="./css/welcome.css?v=20261010-personal">
  <link rel="stylesheet" href="./css/cursor-ripple.css?v=20260721b">
</head>
<body class="welcome-body">

  <!-- Paddi 品牌记忆动画背景 -->
  <video id="welcome-video" class="welcome-animation" autoplay muted loop playsinline preload="auto" aria-label="Paddi 品牌记忆动画">
    <source src="./assets/paddi-brand-memory-animation.mp4" type="video/mp4">
  </video>

  <!-- 降暗遮罩层 -->
  <div class="welcome-overlay"></div>

  <!-- 背景涟漪 canvas（鼠标移动跟随荡开，pointer-events:none 不挡按钮）-->
  <canvas id="ripple-canvas"></canvas>

  <!-- 主容器 -->
  <div class="welcome-wrap">

    <!-- 顶部品牌栏 -->
    <header class="welcome-top">
      <a href="./home.html" class="welcome-brand">
        <span class="wb-dot"></span>
        <span>Paddi</span>
      </a>

      <!-- 语言切换 -->
      <div class="welcome-lang">
        <button class="welcome-lang-btn" id="langToggle" aria-label="切换语言" aria-haspopup="menu" aria-expanded="false" aria-controls="langDropdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          <span id="langCurrent">中文</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="welcome-lang-dropdown" id="langDropdown" role="menu" aria-label="语言选项">
          <button class="lang-option" data-lang="zh" role="menuitemradio" aria-checked="false"><span class="lang-flag">🇨🇳</span>中文</button>
          <button class="lang-option" data-lang="en" role="menuitemradio" aria-checked="false"><span class="lang-flag">🇬🇧</span>English</button>
          <button class="lang-option" data-lang="ja" role="menuitemradio" aria-checked="false"><span class="lang-flag">🇯🇵</span>日本語</button>
          <button class="lang-option" data-lang="ko" role="menuitemradio" aria-checked="false"><span class="lang-flag">🇰🇷</span>한국어</button>
        </div>
      </div>
    </header>

    <!-- 中央内容 -->
    <main class="welcome-center">
      <div class="welcome-eyebrow" data-i18n="welcome.eyebrow">Paddi Studio · 个人主页</div>

      <h1 class="welcome-title">
        <span data-i18n="welcome.title">开始探索这位天才架构师吧~</span>
      </h1>

      <p class="welcome-subtitle" data-i18n="welcome.subtitle">
        网站、移动端 App 与产品架构
      </p>
      <!-- 进入个人主页 -->
      <div class="welcome-cta">
        <a class="welcome-btn-primary" href="./home.html">
          <span data-i18n="welcome.start">进入个人主页</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </main>

    <!-- 底部 -->
    <footer class="welcome-foot">
      <span data-i18n="welcome.foot">Paddi Studio · 万建伟 JewwyWan · Copyright</span>
    </footer>

  </div>

  <!-- JS -->
  <script src="./JS/i18n.js?v=20261011-i18n2"></script>
  <script src="./JS/ripple.js?v=20260721b"></script>
</body>
</html>
